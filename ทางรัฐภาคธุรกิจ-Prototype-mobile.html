<body>
  <div id="__bundler_placeholder">Loading ทางรัฐภาคธุรกิจ ต้นแบบ...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

plete=\"username\"><\u002Fdiv>\n<div class=\"fld\"><label for=\"li_pass\">รหัสผ่าน<\u002Flabel>\n<div class=\"pw\"><input id=\"li_pass\" type=\"{{liType}}\" class=\"in pill-in {{liPassCls}}\" value=\"{{liPass}}\" sc-camel-on-change=\"{{onLiPass}}\" placeholder=\"ใส่รหัสผ่าน\" autocomplete=\"current-password\"><button class=\"ib pweye\" aria-label=\"{{liEyeLabel}}\" sc-camel-on-click=\"{{toggleLiShow}}\"><svg class=\"ico\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"{{liEyeD}}\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; justify-content: flex-end\"><button class=\"lnk\" style=\"text-decoration: underline; color: #1E40AF\" sc-camel-on-click=\"{{forgotPw}}\">ลืมรหัสผ่าน<\u002Fbutton><\u002Fdiv>\n<sc-if value=\"{{hasLiErr}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"al al-err\" role=\"alert\"><div class=\"alb\">{{liErr}}<\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n<button class=\"btn {{liBtnCls}}\" style=\"margin-top: 16px\" disabled=\"{{liDisabled}}\" sc-camel-on-click=\"{{doSignin}}\">ยืนยัน<\u002Fbutton>\n<span class=\"hint center\" style=\"margin-top: 12px\">ต้นแบบ: ใส่เลข 13 หลักหรือชื่อผู้ใช้ และรหัสผ่านอย่างน้อย 6 ตัวอักษร<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{lvRegister}}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n<h2 class=\"lgsub\">เลือกวิธียืนยันตัวตน<\u002Fh2>\n<span class=\"hint\" style=\"font-size: 14px; margin-bottom: 14px\">การยืนยันตัวตนจำเป็นต้องใช้บัตรประจำตัวประชาชนและโทรศัพท์มือถือของคุณ<\u002Fspan>\n<button class=\"rg\" sc-camel-on-click=\"{{regViaApp}}\"><span class=\"rgic\" style=\"background: #E6F2ED; color: #0E6B4E\"><svg class=\"ico\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 12l2 2 4-4\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"grow\"><b>ยืนยันตัวตนผ่านแอปทางรัฐ<\u002Fb><span class=\"hint\">ถ่ายรูปบัตรหรือใส่ข้อมูลด้วยตัวเอง<\u002Fspan><\u002Fspan><\u002Fbutton>\n<div class=\"lbl\" style=\"font-size: 15px\">ยืนยันตัวตนด้วยช่องทางอื่น<\u002Fdiv>\n<sc-for list=\"{{regPlaces}}\" as=\"rp\" hint-placeholder-count=\"5\">\n<button class=\"rg\" sc-camel-on-click=\"{{rp.tap}}\"><span class=\"rgic\"><svg class=\"ico\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"{{rp.d}}\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"grow\"><b>{{rp.t}}<\u002Fb><span class=\"hint\">{{rp.sub}}<\u002Fspan><\u002Fspan><\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{lvConsent}}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n<h2 class=\"lgsub\" style=\"font-size: 20px\">การยินยอมให้ใช้ข้อมูลชีวภาพ (ข้อมูลภาพใบหน้า)<\u002Fh2>\n<p class=\"cst\">เพื่อความปลอดภัยในการใช้บริการ แอปทางรัฐต้องเก็บรวบรวมและประมวลผลข้อมูลชีวภาพ ได้แก่ ภาพใบหน้า (Face Recognition) ของคุณ เพื่อพิสูจน์และยืนยันตัวตนในการเข้าใช้บริการ รวมถึงตรวจสอบข้อมูลกับหน่วยงานรัฐที่เก็บฐานข้อมูลที่น่าเชื่อถือ หากไม่ให้ความยินยอม จะไม่สามารถเข้าใช้บริการแอปทางรัฐได้ ดูรายละเอียดได้ที่ <button class=\"ilnk\" sc-camel-on-click=\"{{showTerms}}\">รายละเอียดความยินยอมในการใช้ข้อมูลส่วนบุคคลที่อ่อนไหว<\u002Fbutton><\u002Fp>\n<p class=\"cst\">หากยืนยันที่จะใช้งาน กด “ยืนยัน” เพื่อเริ่มใช้งาน โดยถือว่าคุณได้อ่าน ทำความเข้าใจ และยอมรับตามข้อกำหนดทั้งหมด<\u002Fp>\n<div style=\"border-top: 1px solid #E3E7EE; margin: 14px 0 10px\"><\u002Fdiv>\n<button class=\"cb {{c1Cls}}\" role=\"checkbox\" aria-checked=\"{{consent1}}\" sc-camel-on-click=\"{{toggleC1}}\"><span class=\"box\"><svg class=\"ico\" width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"grow\">ฉันได้อ่าน และตกลงยอมรับ <u style=\"color: #0E6B4E\">ข้อกำหนดและเงื่อนไขการใช้บริการ<\u002Fu> และ <u style=\"color: #0E6B4E\">ประกาศความเป็นส่วนตัว<\u002Fu><\u002Fspan><\u002Fbutton>\n<button class=\"cb {{c2Cls}}\" role=\"checkbox\" aria-checked=\"{{consent2}}\" sc-camel-on-click=\"{{toggleC2}}\"><span class=\"box\"><svg class=\"ico\" width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"grow\">ฉันรับทราบ และยินยอมให้เก็บรวบรวม และประมวลผลข้อมูลภาพใบหน้าเพื่อวัตถุประสงค์ข้างต้น<\u002Fspan><\u002Fbutton>\n<button class=\"btn {{cBtnCls}}\" style=\"margin-top: 14px\" disabled=\"{{cDisabled}}\" sc-camel-on-click=\"{{consentOk}}\">ยืนยัน<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsc-if>\n\n<sc-if value=\"{{showStepper}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"steps\" aria-label=\"ขั้นตอนการจดทะเบียนบริษัท\">\n<sc-for list=\"{{stepItems}}\" as=\"sp\" hint-placeholder-count=\"5\">\n<div class=\"st {{sp.cls}}\"><span class=\"stc\"><sc-if value=\"{{sp.done}}\" hint-placeholder-val=\"{{ false }}\"><svg class=\"ico\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\u002Fpath><\u002Fsvg><\u002Fsc-if><sc-if value=\"{{sp.notDone}}\" hint-placeholder-val=\"{{ true }}\">{{sp.num}}<\u002Fsc-if><\u002Fspan>{{sp.label}}<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===== 1 HOME ===== -->\n<sc-if value=\"{{isHome}}\" hint-placeholder-val=\"{{ true }}\">\n<div>\n<button class=\"promo {{promoCls}}\" sc-camel-on-click=\"{{promoTap}}\"><span class=\"pt1\">{{promoT1}}<\u002Fspan><span class=\"pt2\">{{promoT2}}<\u002Fspan><span class=\"pt3\">{{promoT3}}<\u002Fspan><span class=\"pic\" aria-hidden=\"true\"><svg class=\"ico\" width=\"44\" height=\"44\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"{{promoD}}\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fbutton>\n<div class=\"dots\" role=\"tablist\" aria-label=\"ประกาศ\"><sc-for list=\"{{promoDots}}\" as=\"pd\" hint-placeholder-count=\"3\"><button class=\"dot2 {{pd.cls}}\" role=\"tab\" aria-selected=\"{{pd.on}}\" aria-label=\"ประกาศที่ {{pd.n}}\" sc-camel-on-click=\"{{pd.pick}}\"><\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n<div class=\"hello\"><span class=\"hav\" aria-hidden=\"true\">ก<\u002Fspan><span class=\"grow\"><b>{{helloName}}<\u002Fb><span class=\"lgin\"><svg class=\"ico\" width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\u002Fpath><\u002Fsvg>เข้าสู่ระบบแล้ว · {{loginViaText}}<\u002Fspan><\u002Fspan><\u002Fdiv>\n<sc-if value=\"{{hasActiveReq}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"card\">\n<div class=\"ch\"><b>งานที่ต้องทำต่อ<\u002Fb><span class=\"pill {{reqPillCls}}\">{{reqPill}}<\u002Fspan><\u002Fdiv>\n<span class=\"hint\">จดทะเบียนบริษัทจำกัด · {{reservedFullOrDraft}}<\u002Fspan>\n<span class=\"hint\">{{homeNext}}<\u002Fspan>\n<sc-if value=\"{{showFillPct}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"prog\" role=\"progressbar\" aria-valuemin=\"0\" aria-valuemax=\"100\" aria-valuenow=\"{{fillPct}}\" aria-label=\"ความคืบหน้าการกรอกข้อมูล\"><div class=\"progtop\"><span>กรอกข้อมูลแล้ว<\u002Fspan><b>{{fillPct}}%<\u002Fb><\u002Fdiv><div class=\"progbar\"><span style=\"width: {{fillPct}}%\"><\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n<div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px\"><button class=\"btn out sm\" sc-camel-on-click=\"{{continueTask}}\">{{homeTaskCta}}<\u002Fbutton><button class=\"lnk\" sc-camel-on-click=\"{{goAllReq}}\">ดูคำขอทั้งหมด ({{reqAllCount}})<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<div class=\"grid3\">\n<sc-for list=\"{{quick}}\" as=\"q\" hint-placeholder-count=\"6\">\n<button class=\"qt2\" sc-camel-on-click=\"{{q.tap}}\"><span class=\"qti\" style=\"color: {{q.c}}\"><svg class=\"ico\" width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"{{q.d}}\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"qtl\">{{q.label}}<\u002Fspan><\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div class=\"shd\"><h2>บริการโปรด<\u002Fh2><button class=\"alnk\" sc-camel-on-click=\"{{seeAll}}\">ดูทั้งหมด<\u002Fbutton><\u002Fdiv>\n<button class=\"favedit\" sc-camel-on-click=\"{{editFav}}\"><span class=\"favbox\"><svg class=\"ico\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 20h4L20 8l-4-4L4 16zM14 6l4 4\"><\u002Fpath><\u002Fsvg><\u002Fspan>แก้ไขบริการ<br>โปรด<\u002Fbutton>\n<div class=\"shd\"><h2>บริการแบ่งตามช่วงชีวิตและความสนใจ<\u002Fh2><button class=\"alnk\" sc-camel-on-click=\"{{seeAll}}\">ดูทั้งหมด<\u002Fbutton><\u002Fdiv>\n<div class=\"lifeg\">\n<sc-for list=\"{{lifeCards}}\" as=\"lc\" hint-placeholder-count=\"4\">\n<button class=\"lifec\" sc-camel-on-click=\"{{lc.tap}}\"><b>{{lc.t}}<\u002Fb><span class=\"lifeic\" style=\"background: {{lc.bg}}; color: {{lc.c}}\"><svg class=\"ico\" width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"{{lc.d}}\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===== 2 BUSINESS SERVICES ===== -->\n<sc-if value=\"{{isBiz}}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n<sc-if value=\"{{showQuiz}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"card\">\n<div class=\"qhead\"><span>ตอบแล้ว {{quizAnswered}} จาก 6 ข้อ<\u002Fspan><button class=\"lnk\" sc-camel-on-click=\"{{skipQuiz}}\">ข้ามไปก่อน<\u002Fbutton><\u002Fdiv>\n<div class=\"segs\"><sc-for list=\"{{quizSegs}}\" as=\"sg\" hint-placeholder-count=\"6\"><span class=\"seg {{sg.cls}}\"><\u002Fspan><\u002Fsc-for><\u002Fdiv>\n<h2 class=\"qt\" style=\"margin-bottom: 4px\">บอกเราเกี่ยวกับธุรกิจของคุณ<\u002Fh2>\n<span class=\"hint\">ตอบครั้งเดียว ระบบจะจำไว้และแนะนำบริการที่ตรงกับธุรกิจของคุณ<\u002Fspan>\n<sc-for list=\"{{quizList}}\" as=\"qq\" hint-placeholder-count=\"6\">\n<div class=\"qblk {{qq.cls}}\">\n<p class=\"qn\"><span class=\"qnum\">{{qq.num}}<\u002Fspan>{{qq.t}}<\u002Fp>\n<span class=\"hint\">{{qq.why}}<\u002Fspan>\n<sc-if value=\"{{qq.isSelect}}\" hint-placeholder-val=\"{{ false }}\">\n<label class=\"sr\" for=\"qtype\">ประเภทธุรกิจ<\u002Flabel>\n<sc-raw-select id=\"qtype\" class=\"in\" style=\"margin-top: 8px\" value=\"{{qq.val}}\" sc-camel-on-change=\"{{qq.onSel}}\">\n<option value=\"\">เลือกประเภทธุรกิจ<\u002Foption>\n<option value=\"food\">ร้านอาหารและเครื่องดื่ม<\u002Foption>\n<option value=\"retail\">ร้านค้าปลีก<\u002Foption>\n<option value=\"ecom\">ขายของออนไลน์ (e-Commerce)<\u002Foption>\n<option value=\"spa\">สปา<\u002Foption>\n<option value=\"clinic\">คลินิกเสริมความงาม<\u002Foption>\n<option value=\"build\">ก่อสร้างและรับเหมาก่อสร้าง<\u002Foption>\n<option value=\"logis\">ขนส่ง โลจิสติกส์<\u002Foption>\n<option value=\"tour\">การท่องเที่ยว<\u002Foption>\n<option value=\"consult\">ให้คำปรึกษาด้านกฎหมายและบัญชี<\u002Foption>\n<option value=\"agri\">แปรรูปสินค้าเกษตรขนาดเล็ก<\u002Foption>\n<\u002Fsc-raw-select>\n<\u002Fsc-if>\n<sc-if value=\"{{qq.isOpts}}\" hint-placeholder-val=\"{{ true }}\">\n<div class=\"qopts\" role=\"radiogroup\" aria-label=\"{{qq.t}}\">\n<sc-for list=\"{{qq.opts}}\" as=\"o\" hint-placeholder-count=\"3\">\n<button class=\"opt {{o.cls}}\" role=\"radio\" aria-checked=\"{{o.on}}\" sc-camel-on-click=\"{{o.pick}}\"><span class=\"radio\"><\u002Fspan>{{o.label}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{qq.miss}}\" hint-placeholder-val=\"{{ false }}\"><p class=\"err\" role=\"alert\" style=\"margin: 6px 0 0\">ยังไม่ได้ตอบข้อนี้<\u002Fp><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<sc-if value=\"{{hasQuizErr}}\" hint-placeholder-val=\"{{ false }}\"><p class=\"err\" role=\"alert\">{{quizErr}}<\u002Fp><\u002Fsc-if>\n<button class=\"btn\" style=\"margin-top: 6px\" sc-camel-on-click=\"{{quizNext}}\">ดูบริการที่แนะนำ<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{showSkipped}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"al al-info\"><div class=\"alb\"><b>อยากได้บริการที่ตรงกับธุรกิจของคุณ?<\u002Fb>ตอบคำถามสั้น ๆ 6 ข้อ ระบบจะแนะนำบริการที่ต้องใช้ให้ก l2 {{vatCondBOnCls}}\" role=\"checkbox\" aria-checked=\"{{vatCondBOn}}\" sc-camel-on-click=\"{{toggleVatCondB}}\"><span class=\"bx\"><svg class=\"ico\" width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"grow\">วันที่แจ้งต่ออธิบดีเพื่อขอจดทะเบียนภาษีมูลค่าเพิ่ม (กรณีเป็นกิจการที่ได้รับยกเว้น)<\u002Fspan><\u002Fbutton>\n<sc-for list=\"{{vatExItems}}\" as=\"vx\" hint-placeholder-count=\"11\"><button class=\"vck {{vx.cls}}\" role=\"checkbox\" aria-checked=\"{{vx.on}}\" sc-camel-on-click=\"{{vx.toggle}}\" disabled=\"{{vx.dis}}\"><span class=\"bx\"><svg class=\"ico\" width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"grow\">{{vx.label}}<\u002Fspan><\u002Fbutton><\u002Fsc-for>\n<sc-if value=\"{{b_vatEx}}\" hint-placeholder-val=\"{{ false }}\"><p class=\"err\" role=\"alert\">{{e_vatEx}}<\u002Fp><\u002Fsc-if>\n<div class=\"vnum\">3. ในวันยื่นคำขอจดทะเบียนภาษีมูลค่าเพิ่ม มีรายรับประมาณเดือนละ<\u002Fdiv>\n<label class=\"sr\" for=\"f_vatRev\">รายรับประมาณเดือนละ (บาท)<\u002Flabel><div class=\"unitw\"><input id=\"f_vatRev\" type=\"text\" class=\"in {{c_vatRev}}\" value=\"{{v_vatRev}}\" sc-camel-on-change=\"{{on_vatRev}}\" placeholder=\"เช่น 150000\" inputmode=\"numeric\"><span class=\"u\">บาท<\u002Fspan><\u002Fdiv><sc-if value=\"{{b_vatRev}}\" hint-placeholder-val=\"{{ false }}\"><p class=\"err\" role=\"alert\">{{e_vatRev}}<\u002Fp><\u002Fsc-if>\n<div class=\"vnum\">4. ประเภทของการประกอบกิจการ เรียงตามลำดับประเภทสินค้าและหรือบริการของการประกอบกิจการส่วนใหญ่ (ระบุลำดับตามจำนวนรายรับจากมากไปหาน้อย)<\u002Fdiv>\n<span class=\"hint\" style=\"margin: -2px 0 8px\">แถวแรกเติมจากรหัสธุรกิจ (TSIC) ที่เลือกในขั้น 3.1 แก้ได้<\u002Fspan>\n<sc-for list=\"{{vatActRows}}\" as=\"va\" hint-placeholder-count=\"6\"><div class=\"actrow\"><sc-raw-select class=\"in\" aria-label=\"ประเภทกิจการลำด {{dr.v}}<\u002Fspan><\u002Fdiv><\u002Fsc-for><button class=\"btn ghost sm mt\" sc-camel-on-click=\"{{d.edit}}\">แก้ไขข้อมูลส่วนนี้<\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<div class=\"card\">\n<b>พยาน 2 คน<\u002Fb>\n<span class=\"hint\" style=\"margin-bottom: 10px\">พยานรับรองว่าผู้เริ่มก่อการทุกคนลงลายมือชื่อต่อหน้าพยาน (ตามแบบ บอจ.2) หลังนายทะเบียนตรวจผ่าน พยานจะได้รับลิงก์ให้ลงนามผ่านแอปทางรัฐ<\u002Fspan>\n<div class=\"lbl\" style=\"margin-top: 0\">พยานคนที่ 1<\u002Fdiv>\n<div class=\"fld\"><label for=\"f_w1Name\">ชื่อ-นามสกุล<\u002Flabel><input id=\"f_w1Name\" type=\"text\" class=\"in {{c_w1Name}}\" value=\"{{v_w1Name}}\" sc-camel-on-change=\"{{on_w1Name}}\" placeholder=\"เช่น นางสาวพิมพ์ชนก แสงทอง\"><sc-if value=\"{{b_w1Name}}\" hint-placeholder-val=\"{{ false }}\"><p class=\"err\" role=\"alert\">{{e_w1Name}}<\u002Fp><\u002Fsc-if><\u002Fdiv>\n<div class=\"fld\"><label for=\"f_w1Id\">เลขบัตรประจำตัวประชาชน<\u002Flabel><input id=\"f_w1Id\" type=\"text\" class=\"in {{c_w1Id}}\" value=\"{{v_w1Id}}\" sc-camel-on-change=\"{{on_w1Id}}\" placeholder=\"13 หลัก\" inputmode=\"numeric\" maxlength=\"13\"><sc-if value=\"{{b_w1Id}}\" hint-placeholder-val=\"{{ false }}\"><p class=\"err\" role=\"alert\">{{e_w1Id}}<\u002Fp><\u002Fsc-if><\u002Fdiv>\n<div class=\"lbl\">พยานคนที่ 2<\u002Fdiv>\n<div class=\"fld\"><label for=\"f_w2Name\">ชื่อ-นามสกุล<\u002Flabel><input id=\"f_w2Name\" type=\"text\" class=\"in {{c_w2Name}}\" value=\"{{v_w2Name}}\" sc-camel-on-change=\"{{on_w2Name}}\" placeholder=\"เช่น นายวีรยุทธ มั่นคง\"><sc-if value=\"{{b_w2Name}}\" hint-placeholder-val=\"{{ false }}\"><p class=\"err\" role=\"alert\">{{e_w2Name}}<\u002Fp><\u002Fsc-if><\u002Fdiv>\n<div class=\"fld\"><label for=\"f_w2Id\">เลขบัตรประจำตัวประชาชน<\u002Flabel><input id=\"f_w2Id\" type=\"text\" class=\"in {{c_w2Id}}\" value=\"{{v_w2Id}}\" sc-camel-on-change=\"{{on_w2Id}}\" placeholder=\"13 หลัก\" inputmode=\"numeric\" maxlength=\"13\"><sc-if value=\"{{b_w2Id}}\" hint-placeholder-val=\"{{ false }}\"><p class=\"err\" role=\"alert\">{{e_w2Id}}<\u002Fp><\u002Fsc-if><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"al al-info\"><div class=\"alb\"><b>ขั้นตอนหลังยื่น<\u002Fb>นายทะเบียนตรวจความครบถ้วน → ตรวจผ่านแล้วจึงลงลายมือชื่ออิเล็กทรอนิกส์ → ชำระค่าธรรมเนียม → นายทะเบียนรับจดทะเบียน<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{r_done}}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n<div class=\"donebox\">\n<div class=\"bigok\"><svg class=\"ico\" width=\"36\" height=\"36\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h2 class=\"ttl\">ยื่นคำขอจดทะเบียนเรียบร้อยแล้ว<\u002Fh2>\n<p style=\"margin: 4px 0\">เลขที่คำขอ <b>{{reqNo}}<\u002Fb><\u002Fp>\n<p style=\"margin: 0 0 8px\">จำนวนคิวของท่านอยู่ในลำดับที่ <b>1<\u002Fb><\u002Fp>\n<span class=\"hint\">นายทะเบียนจะตรวจความครบถ้วนตามคู่มือภายใน 50 นาที เมื่อตรวจผ่าน แอปจะแจ้งให้ลงลายมือชื่ออิเล็กทรอนิกส์และชำระค่าธรรมเนียม ติดตามได้ที่ อื่นๆ › คำขอของฉัน<\u002Fspan>\n<div style=\"height: 20px\"><\u002Fdiv>\n<button class=\"btn\" sc-camel-on-click=\"{{goReq}}\">ติดตามคำขอ<\u002Fbutton>\n<button class=\"btn ghost mt\" sc-camel-on-click=\"{{goHome}}\">กลับหน้าหลัก<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{showSub}}\" hint-placeholder-val=\"{{ true }}\">\n<div>\n<sc-if value=\"{{hasStepErr}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"al al-err\" role=\"alert\"><div class=\"alb\">ยังกรอกไม่ครบ {{stepErrCount}} จุด ดูข้อความสีแดงในแต่ละช่อง<\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n<div class=\"wzbtns\"><button class=\"btn out\" sc-camel-on-click=\"{{subBack}}\">ย้อนกลับ<\u002Fbutton><button class=\"btn\" sc-camel-on-click=\"{{subNext}}\">{{nextLabel}}<\u002Fbutton><\u002Fdiv>\n<sc-if value=\"{{canJumpReview}}\" hint-placeholder-val=\"{{ false }}\"><button class=\"btn out mt\" sc-camel-on-click=\"{{jumpReview}}\">บันทึกและกลับไปหน้าสรุปข้อมูล<\u002Fbutton><\u002Fsc-if>\n<button class=\"btn ghost mt\" sc-camel-on-click=\"{{saveDraft}}\">บันทึกแบบร่าง<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===== 5 MY REQUESTS ===== -->\n<sc-if value=\"{{isReq}}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n<div class=\"tabs\" role=\"tablist\">\n<sc-for list=\"{{reqTabs}}\" as=\"t\" hint-placeholder-count=\"5\">\n<button class=\"tab {{t.cls}}\" role=\"tab\" aria-selected=\"{{t.on}}\" sc-camel-on-click=\"{{t.pick}}\">{{t.label}}<sc-if value=\"{{t.hasCount}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"cnt\">{{t.count}}<\u002Fspan><\u002Fsc-if><\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<sc-if value=\"{{reqEmpty}}\" hint-placeholder-val=\"{{ true }}\">\n<div class=\"empty\">ไม่มีคำขอในสถานะนี้<sc-if value=\"{{noReqAtAll}}\" hint-placeholder-val=\"{{ true }}\"><div style=\"margin-top: 10px; display: flex; justify-content: center\"><button class=\"btn sm\" sc-camel-on-click=\"{{goBizFromReq}}\">ไปที่บริการภาคธุรกิจ<\u002Fbutton><\u002Fdiv><\u002Fsc-if><\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{reqShow}}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n<div class=\"card\">\n<div class=\"ch\"><b>จดทะเบียนบริษัทจำกัด<\u002Fb><span class=\"pill {{reqPillCls}}\">{{reqPill}}<\u002Fspan><\u002Fdiv>\n<div class=\"kv\"><span>บริษัท<\u002Fspan><span>{{reservedFullOrDraft}}<\u002Fspan><\u002Fdiv>\n<div class=\"kv\"><span>เลขที่คำขอ<\u002Fspan><span>{{reqNoOrDash}}<\u002Fspan><\u002Fdiv>\n<div class=\"kv\"><span>ยื่นเมื่อ<\u002Fspan><span>{{reqDate}}<\u002Fspan><\u002Fdiv>\n<div class=\"kv\"><span>เลขทะเบียนนิติบุคคล<\u002Fspan><span>{{regNoText}}<\u002Fspan><\u002Fdiv>\n<sc-if value=\"{{isDraft}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"hint\" style=\"margin-top: 8px\">ยังไม่ได้ส่งคำขอ: {{draftNext}}<\u002Fspan><button class=\"btn sm mt\" sc-camel-on-click=\"{{continueTask}}\">ทำต่อ<\u002Fbutton><\u002Fsc-if>\n<sc-if value=\"{{showTimeline}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"lbl\">ขั้นตอนหลังยื่นคำขอ<\u002Fdiv>\n<ol class=\"tl\">\n<sc-for list=\"{{timeline}}\" as=\"ti\" hint-placeholder-count=\"4\">\n<li class=\"tli {{ti.cls}}\"><span class=\"dot\"><sc-if value=\"{{ti.isDone}}\" hint-placeholder-val=\"{{ false }}\"><svg class=\"ico\" width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\u002Fpath><\u002Fsvg><\u002Fsc-if><sc-if value=\"{{ti.notDone}}\" hint-placeholder-val=\"{{ true }}\">{{ti.num}}<\u002Fsc-if><\u002Fspan><div class=\"tlb\"><b>{{ti.title}}<\u002Fb><span class=\"hint\">{{ti.sub}}<\u002Fspan><span class=\"pill {{ti.pillCls}}\" style=\"margin-top: 4px\">{{ti.pill}}<\u002Fspan><\u002Fdiv><\u002Fli>\n<\u002Fsc-for>\n<\u002Fol>\n<\u002Fsc-if>\n<\u002Fdiv>\n<sc-if value=\"{{isReturned}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"card\" style=\"border-color: #F3B8B2\">\n<div class=\"ch\"><b>คืนเรื่องเพื่อแก้ไข<\u002Fb><span class=\"pill p-err\">แก้ 1 จุด<\u002Fspan><\u002Fdiv>\n<span class=\"hint\">นายทะเบียนแจ้งทุกจุดที่ต้องแก้ในครั้งเดียว โดยเลือกเหตุผลจากรายการมาตรฐาน<\u002Fspan>\n<div class=\"al al-err mt\"><div class=\"alb\"><b>R03 · เอกสารไม่สมบูรณ์<\u002Fb>หนังสือยินยอมให้ใช้สถานที่ยังไม่มีลายมือชื่อเจ้าของบ้าน<\u002Fdiv><\u002Fdiv>\n<button class=\"btn\" sc-camel-on-click=\"{{resubmit}}\"><svg class=\"ico\" width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 8h3l2-3h6l2 3h3v11H4zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z\"><\u002Fpath><\u002Fsvg>ถ่ายรูปแนบเอกสารใหม่<\u002Fbutton>\n<button class=\"btn ghost mt\" sc-camel-on-click=\"{{askAiReturn}}\">ถาม AI ว่าต้องแก้อะไร<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{isSign}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"card\" style=\"border-color: #F5C78E\">\n<div class=\"ch\"><b>ลงลายมือชื่ออิเล็กทรอนิกส์<\u002Fb><span class=\"pill {{signPillCls}}\">{{signSummary}}<\u002Fspan><\u002Fdiv>\n<span class=\"hint\">นายทะเบียนตรวจผ่านแล้ว · ช่องทาง: ยื่นจดทะเบียนออนไลน์ ทุกคนลงนามผ่ .setState({ payErr: '' });\n    if (s.payMethod === 'bank') {\n      this.load('กำลังเชื่อมต่อธนาคาร', 1300, () => {\n        if (!this.state.bankFailed) { this.setState({ bankFailed: true, payErr: 'ระบบธนาคารขัดข้องชั่วคราว (ข้อผิดพลาดจำลอง) ลองอีกครั้ง หรือเลือก Thai QR Payment' }); this.toastMsg('ชำระเงินไม่สำเร็จ', 'err'); return; }\n        this.paidDone();\n      });\n      return;\n    }\n    this.qrToken = (this.qrToken || 0) + 1;\n    this.setState({ sheet: 'qr', qrLeft: 180 });\n    this.tick(this.qrToken);\n  }\n  tick(tok) {\n    this.later(() => {\n      if (tok !== this.qrToken || this.state.sheet !== 'qr') return;\n      const n = this.state.qrLeft - 1;\n      if (n <= 0) { this.setState({ sheet: null, qrLeft: 0, payErr: 'QR Code หมดอายุ กด “ยืนยันการทำรายการ” เพื่อสร้าง QR ใหม่' }); return; }\n      this.setState({ qrLeft: n }); this.tick(tok);\n    }, 1000);\n  }\n  qrPaid() { this.qrToken = (this.qrToken || 0) + 1; this.setState({ sheet: null }); this.load('กำลังตรวจสอบการชำระเงิน', 1300, () => this.paidDone()); }\n  qrClose() { this.qrToken = (this.qrToken || 0) + 1; this.setState({ sheet: null }); this.toastMsg('ปิด QR แล้ว ยังไม่ได้ชำระเงิน', 'info'); }\n  paidDone() {\n    this.setState({ reqStage: 'record', reqTab: 'passed', payErr: '' });\n    this.notify('ชำระค่าธรรมเนียม ' + this.fmt(this.totalFee()) + ' บาทแล้ว นายทะเบียนกำลังรับจดทะเบียน');\n  }\n\n  // requests (simulated registrar)\n  advance() {\n    const s = this.state.reqStage;\n    const next = { check: 'returned', check2: 'sign', record: 'delay', delay: 'done' }[s];\n    if (!next) return;\n    const msg = { returned: 'คำขอถูกคืนเพื่อแก้ไข 1 จุด', sign: 'นายทะเบียนตรวจผ่านแล้ว ลงลายมือชื่ออิเล็กทรอนิกส์ต่อได้เลย', delay: 'ขั้นรับจดทะเบียนเกินเวลาตามคู่มือ ดูเหตุผลในคำขอ', done: 'จดทะเบียนสำเร็จ เอกสารอยู่ในกระเป๋าเอกสารแล้ว' }[next];\n    this.load('นายทะเบียนกำลังดำเนินการ', 900, () => {\n      if (next === 'done') { this.setState(st => ({ reqStage: next, reqTab: this.tabFor(next
